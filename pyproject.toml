[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekey"
version = "0.1.0"
description = "Zero-downtime, dual-key API key rotation for developers and agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pynacl>=1.5",        # GitHub Actions secret encryption (sealed box)
    "pyjwt[crypto]>=2.8", # GitHub App JWT signing
    "keyring>=24.0",      # OS keyring support for modern CLIs (Stripe, etc.)
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
rekey = "rekey.cli:main"
rekey-mcp = "rekey.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rekey"]

[tool.pytest.ini_options]
pythonpath = ["src"]
